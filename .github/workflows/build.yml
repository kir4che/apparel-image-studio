name: Build Windows Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt pyinstaller

      - name: Build executable
        run: python build_windows.py

      - name: List build output
        run: |
          dir dist
          dir "dist\服飾圖片工作室"

      - name: Create release archive
        run: |
          Compress-Archive -Path "dist\服飾圖片工作室\*" -DestinationPath "apparel-image-studio-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apparel-image-studio-windows-x64
          path: apparel-image-studio-windows-x64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: apparel-image-studio-windows-x64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: apparel-image-studio-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
